<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Core Java — Banking Examples</title>
  <style>
    :root { --bg:#0b1220; --card:#18233a; --text:#e8eefc; --muted:#9aaccc; --accent:#5eead4; --accent2:#93c5fd; --warn:#fbbf24; --bad:#fb7185; --ok:#86efac; --line:#243049; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:"Segoe UI",Inter,system-ui,sans-serif; }
    #deck { height:100%; }
    .slide { display:none; height:100%; padding:48px 64px 72px; flex-direction:column; justify-content:center; }
    .slide.on { display:flex; }
    .slide.title-slide { background:radial-gradient(1200px 500px at 10% -10%,#164e63 0%,transparent 50%),radial-gradient(900px 400px at 100% 0%,#1e3a8a 0%,transparent 45%),var(--bg); }
    h1 { font-size:2.6rem; margin:0 0 12px; letter-spacing:-0.03em; }
    h2 { font-size:2rem; margin:0 0 20px; color:var(--accent); }
    h3 { font-size:1.25rem; margin:0 0 8px; color:var(--accent2); }
    p,li { font-size:1.22rem; line-height:1.45; }
    .muted { color:var(--muted); }
    .kicker { text-transform:uppercase; letter-spacing:0.16em; color:var(--accent); font-size:0.85rem; font-weight:700; margin-bottom:10px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; flex:1; min-width:220px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
    table { width:100%; border-collapse:collapse; font-size:1.05rem; }
    th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--accent); }
    pre { background:#070d18; border:1px solid var(--line); border-radius:12px; padding:16px 18px; overflow:auto; font-size:0.95rem; line-height:1.4; color:#d1fae5; font-family:ui-monospace,Consolas,monospace; }
    .pill { display:inline-block; background:#134e4a; color:var(--accent); border-radius:999px; padding:4px 10px; font-size:0.85rem; margin-right:6px; }
    .warn { color:var(--warn); } .bad { color:var(--bad); } .ok { color:var(--ok); }
    footer.bar { position:fixed; left:0; right:0; bottom:0; height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; background:#070d18; border-top:1px solid var(--line); font-size:0.85rem; color:var(--muted); z-index:5; }
    #progress { position:absolute; left:0; top:0; height:3px; background:var(--accent); width:0; }
    .nav-btn {
      position:fixed; top:50%; transform:translateY(-50%); z-index:6;
      display:flex; align-items:center; gap:8px; padding:14px 18px;
      background:rgba(24,35,58,0.92); border:1px solid var(--line); border-radius:12px;
      color:var(--text); font-size:1rem; font-weight:600; cursor:pointer;
      backdrop-filter:blur(8px); transition:background 0.15s, border-color 0.15s, opacity 0.15s;
      font-family:inherit;
    }
    .nav-btn:hover:not(:disabled) { background:var(--card); border-color:var(--accent); color:var(--accent); }
    .nav-btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .nav-btn:disabled { opacity:0.35; cursor:not-allowed; }
    .nav-btn .arrow { font-size:1.4rem; line-height:1; }
    #btn-prev { left:20px; }
    #btn-next { right:20px; flex-direction:row-reverse; }
    @media (max-width: 720px) {
      .nav-btn { padding:12px 14px; }
      .nav-btn .label { display:none; }
      #btn-prev { left:10px; }
      #btn-next { right:10px; }
    }
    #notes { display:none; position:fixed; right:16px; bottom:60px; width:min(420px,40vw); max-height:40vh; overflow:auto; background:#0f172a; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:0.9rem; color:#cbd5e1; }
    #notes.on { display:block; }
    ul.tight li { margin:8px 0; }
    .big { font-size:1.6rem; }
    .tree { font-size:1.15rem; line-height:1.7; background:var(--card); padding:18px 22px; border-radius:12px; border:1px solid var(--line); }
    @media print { .slide { display:block!important; page-break-after:always; } footer.bar,#notes,.nav-btn { display:none!important; } }
  </style>
</head>
<body>
  <div id="deck"></div>
  <div id="notes"></div>
  <button type="button" class="nav-btn" id="btn-prev" aria-label="Previous slide">
    <span class="arrow" aria-hidden="true">←</span><span class="label">Previous</span>
  </button>
  <button type="button" class="nav-btn" id="btn-next" aria-label="Next slide">
    <span class="arrow" aria-hidden="true">→</span><span class="label">Next</span>
  </button>
  <footer class="bar"><div id="progress"></div><span>Core Java · Banking · OOP · Collections · Generics</span><span id="pos">1 / 1</span><span>Buttons · ← → Space · N notes · P print</span></footer>
  <script>
    const S = [];
    function slide(html, notes) { S.push({ html, notes: notes || "" }); }

    slide(`<div class="kicker">Internal technical session · 3 hours</div><h1>Core Java</h1><p class="big">OOP · Collections · Generics</p><p class="muted">Hands-on with a mini banking core — accounts, branches, interest, overdraft.</p><p style="margin-top:28px"><span class="pill">Banking domain</span><span class="pill">Live coding</span><span class="pill">Q&amp;A last 30 min</span></p>`, "Welcome. Contract: model accounts correctly, pick collections wisely, use generics.");

    slide(`<h2>The contract for this room</h2><div class="grid2"><div class="card"><h3>You will be able to</h3><ul class="tight"><li>Model savings, checking, wallet with OOP</li><li>Look up accounts by number and group by branch</li><li>Close inactive accounts without iterator bugs</li><li>Build <code>Repository&lt;T&gt;</code> instead of raw Lists</li></ul></div><div class="card"><h3>We will not</h3><ul class="tight"><li>Use <code>double</code> for money</li><li>Pretend getters = encapsulation</li><li>Switch on <code>accountType</code> strings forever</li><li>Deep-dive Spring/JPA in Block A</li></ul></div></div>`, "Set success criteria. Park frameworks.");

    slide(`<h2>Agenda — protect the clock</h2><table><tr><th>When</th><th>Block</th><th>Outcome</th></tr><tr><td>0:00–0:30</td><td>Concepts</td><td>Vocabulary + mental models</td></tr><tr><td>0:30–2:30</td><td>Labs</td><td>Banking demos + exercises</td></tr><tr><td>2:30–3:00</td><td>Q&amp;A</td><td>Recap + homework</td></tr></table><p class="muted" style="margin-top:18px">Break ~1:30. Interrupt for confusion.</p>`, "Write blocks on whiteboard.");

    slide(`<h2>How a strong technical session runs</h2><div class="grid3"><div class="card"><h3>1. One domain</h3><p>Every example is banking. Same customers, branches, accounts all day.</p></div><div class="card"><h3>2. Break it live</h3><p>Overdraft rejection, CME, raw-type ClassCastException — on purpose.</p></div><div class="card"><h3>3. Monday decisions</h3><p>After each demo: <em>where does this show up in a core banking service?</em></p></div></div>`, "Culture slide.");

    slide(`<h2>Running example</h2><div class="tree">Account (abstract)<br>&nbsp;&nbsp;├── SavingsAccount&nbsp;&nbsp;implements InterestBearing<br>&nbsp;&nbsp;├── CheckingAccount&nbsp;overdraft-aware withdraw<br>&nbsp;&nbsp;└── PrepaidWallet&nbsp;&nbsp;&nbsp;no interest</div><p>Plus <code>Customer</code>, <code>AccountRegistry</code>, <code>Repository&lt;T&gt;</code>.</p>`, "Point at this tree whenever topic changes.");

    slide(`<h2>Why banking fits Core Java</h2><table><tr><th>Real pain</th><th>Today's tool</th></tr><tr><td><code>if ("SAVINGS")</code> / <code>if ("CHECKING")</code></td><td>Inheritance + polymorphism</td></tr><tr><td>Scan list to find SA-101</td><td><code>Map&lt;String, Account&gt;</code></td></tr><tr><td>Duplicate account numbers</td><td><code>equals</code>/<code>hashCode</code> + registry guard</td></tr><tr><td>Raw account list in memory</td><td><code>Repository&lt;SavingsAccount&gt;</code></td></tr></table>`, "Legacy cores store type as String — we show the better shape.");

    slide(`<div class="kicker">Block A · 30 min</div><h1>Conceptual overview</h1><p class="big muted">OOP models accounts. Collections model groups. Generics protect both.</p>`, "No live IDE yet.");

    slide(`<h2>The problem OOP exists to kill</h2><pre>if ("SAVINGS".equals(type)) { accrueInterest(); }
else if ("CHECKING".equals(type)) { checkOverdraft(); }
else if ("WALLET".equals(type)) { /* no interest */ }
else { /* every new product */ }</pre><p>New account product → edit this pile. Polymorphism: <strong>new class, old loop.</strong></p>`, "Ask who has seen this in a banking/monolith codebase.");

    slide(`<h2>Class vs object</h2><div class="grid2"><div class="card"><h3>Class</h3><p>Blueprint loaded once.</p><pre>public class Customer { ... }</pre></div><div class="card"><h3>Object</h3><p>Instance on the heap.</p><pre>Customer priya = new Customer(
  "C1001", "Priya Sharma");</pre></div></div>`, "Two customers, one class.");

    slide(`<h2>Encapsulation</h2><p>Protect ledger invariants — not “I wrote getters.”</p><ul class="tight"><li>Balance is private; mutate only via deposit/withdraw</li><li>Amounts must be positive</li><li>Checking cannot exceed overdraft limit</li></ul><pre>if (projected.compareTo(overdraftLimit.negate()) &lt; 0)
  throw new IllegalStateException("Overdraft exceeded");</pre>`, "Ask: what if balance were public?");

    slide(`<h2>Four pillars — banking edition</h2><table><tr><th>Pillar</th><th>Here</th></tr><tr><td>Encapsulation</td><td>private balance, validated transactions</td></tr><tr><td>Inheritance</td><td>SavingsAccount extends Account</td></tr><tr><td>Polymorphism</td><td>statementLine(), withdraw()</td></tr><tr><td>Abstraction</td><td>formatLabel(), InterestBearing</td></tr></table>`, "Room shout examples — 90 seconds max.");

    slide(`<h2>Inheritance = is-a</h2><pre>public abstract class Account implements Transactable { ... }
public class SavingsAccount extends Account implements InterestBearing { ... }</pre><p class="warn">Do not inherit just to reuse a helper. Coupling, not design.</p>`, "Liskov: checking can go negative within limit — document the contract.");

    slide(`<h2>has-a vs is-a vs can-do</h2><div class="grid3"><div class="card"><h3>is-a</h3><p><code>SavingsAccount</code> is <code>Account</code></p></div><div class="card"><h3>has-a</h3><p><code>Account</code> has <code>Customer</code></p></div><div class="card"><h3>can-do</h3><p><code>Transactable</code>, <code>InterestBearing</code></p></div></div>`, "Wallet: is-a Account, can-do Transactable, not InterestBearing.");

    slide(`<h2>Polymorphism</h2><pre>List&lt;Account&gt; portfolio = Arrays.asList(savings, checking, wallet);
for (Account account : portfolio) {
    System.out.println(account.statementLine());
}</pre><p>Compile-time: <code>Account</code>. Runtime: <code>CheckingAccount.formatLabel()</code>.</p>`, "Draw reference type vs object type.");

    slide(`<h2>Abstraction — template method</h2><pre>public final String statementLine() {
  return "[" + formatLabel() + "] " + accountNumber + " ...";
}
protected abstract String formatLabel();</pre><p>Parent owns statement header. Child fills product label.</p>`, "Always @Override formatLabel.");

    slide(`<h2>Interfaces</h2><pre>interface Transactable { deposit(); withdraw(); getBalance(); }
interface InterestBearing { getInterestRate(); accrueInterest(); }</pre><p>Wallet transacts but <span class="ok">does not</span> accrue interest. No fake <code>rate = 0</code>.</p>`, "Multiple interfaces OK. One superclass.");

    slide(`<h2>Abstract class vs interface</h2><table><tr><th></th><th>Abstract class</th><th>Interface</th></tr><tr><td>Shared state</td><td>balance, accountNumber</td><td>constants only</td></tr><tr><td>Constructors</td><td>yes</td><td>no</td></tr><tr><td>Multiple</td><td>one parent</td><td>many</td></tr><tr><td>Pick</td><td>Account</td><td>Transactable, InterestBearing</td></tr></table>`, "Money stays BigDecimal everywhere.");

    slide(`<h2>equals and hashCode</h2><pre>return accountNumber.equals(other.accountNumber);</pre><p>Business key = account number. Required for HashSet/HashMap indexes in the registry.</p>`, "Never use mutable fields in hashCode.");

    slide(`<h2>Collections</h2><div class="grid3"><div class="card"><h3>List</h3><p>Ordered accounts for statements</p></div><div class="card"><h3>Set</h3><p>Unique payment rails: UPI, NEFT, IMPS</p></div><div class="card"><h3>Map</h3><p>accountNumber → Account; branch → bucket</p></div></div>`, "Shout: lookup SA-101 — Map.");

    slide(`<h2>Pick the structure</h2><table><tr><th>Need</th><th>Pick</th></tr><tr><td>Statement order</td><td>List / ArrayList</td></tr><tr><td>Unique rails</td><td>Set / HashSet or LinkedHashSet</td></tr><tr><td>Find by account number</td><td>Map / HashMap</td></tr><tr><td>Recently opened, stable iterate</td><td>LinkedHashMap</td></tr></table>`, "Hashtable/Vector = legacy.");

    slide(`<h2>Iterators</h2><p>Close zero-balance inactive accounts while iterating.</p><pre>Iterator&lt;Account&gt; it = list.iterator();
while (it.hasNext()) {
  if (inactive(it.next())) it.remove();
}</pre><p class="bad">for-each + list.remove → ConcurrentModificationException</p>`, "We break this live in Block B.");

    slide(`<h2>Generics</h2><pre>Repository&lt;SavingsAccount&gt; accounts = new Repository&lt;&gt;();
Repository&lt;Customer&gt; customers = new Repository&lt;&gt;();
// customers.save("SA-101", savings); // compile error</pre><p>Move ClassCastException left — to compile time.</p>`, "PECS in Block B.");

    slide(`<h2>Block A recap</h2><ul class="tight"><li>is-a / has-a / can-do</li><li>Polymorphic statementLine + withdraw</li><li>List / Set / Map in ten seconds</li><li>Iterator.remove for in-flight deletes</li><li>BigDecimal + generics, no raw Lists</li></ul><p class="muted">Open workbook. Labs: <code>core-java-session/labs</code></p>`, "Water. DemoOOP next.");

    slide(`<div class="kicker">Block B · 2 hours</div><h1>Labs</h1><p class="big">Mini bank core — real exceptions, pair exercises.</p>`, "Large IDE font.");

    slide(`<h2>Lab map</h2><table><tr><th>Clock</th><th>Demo</th><th>Exercise</th></tr><tr><td>0:30–0:50</td><td>Customer, Account, Savings</td><td>Ex 1 TermDeposit</td></tr><tr><td>0:50–1:10</td><td>Polymorphic portfolio</td><td>Ex 2</td></tr><tr><td>1:10–1:30</td><td>Overdraft + InterestBearing</td><td>—</td></tr><tr><td>1:40–2:10</td><td>AccountRegistry + CME</td><td>Ex 3</td></tr><tr><td>2:10–2:25</td><td>DemoGenerics</td><td>Ex 4</td></tr><tr><td>2:25–2:30</td><td>BankingApp</td><td>—</td></tr></table>`, "Cut PECS if late, not CME.");

    slide(`<h2>Demo 1 — Customer &amp; Account</h2><p>Run <code>com.banking.session.oop.DemoOOP</code></p><ul class="tight"><li>Two Customer objects</li><li>Savings / Checking / Wallet share Account</li><li>BigDecimal balances</li></ul>`, "File-by-file narration.");

    slide(`<h2>Demo 2 — polymorphism</h2><pre>for (Account account : portfolio) {
  System.out.println(account.statementLine());
}</pre><p>Three products, one loop. No accountType switch.</p>`, "Compile vs runtime type on board.");

    slide(`<h2>Demo 3 — interfaces</h2><ul class="tight"><li>Third checking withdraw <span class="bad">fails</span> — overdraft</li><li>Savings accrues interest</li><li>Wallet does not</li><li>Same account number ⇒ equals true</li></ul>`, "Exercise 1+2 after this.");

    slide(`<h2>instanceof — smell vs tool</h2><div class="grid2"><div class="card"><h3 class="bad">Smell</h3><p>Core transaction loop switching on product type</p></div><div class="card"><h3 class="ok">Tool</h3><p>End-of-day interest batch: <code>instanceof InterestBearing</code></p></div></div>`, "BankingApp uses instanceof at accrual boundary — say why.");

    slide(`<h2>Break · 10 min</h2><p class="big">Next: AccountRegistry and we crash a for-each.</p>`, "No new topics during break.");

    slide(`<h2>Demo 4 — AccountRegistry</h2><table><tr><td>List</td><td>ordered accounts</td></tr><tr><td>Map</td><td>findByNumber</td></tr><tr><td>Map of Set</td><td>byBranch</td></tr><tr><td>unmodifiable returns</td><td>encapsulation</td></tr></table>`, "Single open() keeps indexes consistent.");

    slide(`<h2>Set — payment rails</h2><pre>[UPI, NEFT, UPI, IMPS, NEFT]
HashSet        → no order
LinkedHashSet  → insertion order
TreeSet        → sorted</pre>`, "Run DemoCollections lines.");

    slide(`<h2>Break the iterator</h2><pre class="bad">for (Account a : orderedAccounts) {
  if (zeroBalance(a)) orderedAccounts.remove(a);
}</pre><p class="ok">Fix: Iterator.remove() in closeZeroBalanceInactive()</p>`, "Highest-energy moment. Let it stack trace.");

    slide(`<h2>Demo 5 — generics</h2><p>Raw List → ClassCastException. Then Repository&lt;SavingsAccount&gt;.</p><pre>void print(List&lt;? extends Account&gt; accounts);
void addInterest(List&lt;? super InterestBearing&gt; dest, ...);</pre>`, "PECS one breath.");

    slide(`<h2>Capstone — BankingApp</h2><ul class="tight"><li>Repository&lt;Customer&gt;</li><li>AccountRegistry</li><li>Deposits / withdrawals</li><li>Interest accrual batch</li><li>Branch grouping BLR-01</li></ul>`, "Run once. Trace with cursor.");

    slide(`<div class="kicker">Block C · 30 min</div><h1>Q&amp;A</h1><p class="big muted">BigDecimal, overdraft rules, HashMap vs Hashtable.</p>`, "Q_AND_A.md on second screen.");

    slide(`<h2>Five things to keep</h2><ol><li>is-a / has-a / can-do</li><li>New product ≠ edit old loops</li><li>List / Set / Map — decide fast</li><li>Never remove in for-each</li><li>No raw types; BigDecimal for money</li></ol>`, "Leave up during Q&A.");

    slide(`<h2>Homework</h2><ul class="tight"><li>Exercises 1–3 if unfinished</li><li>Pager&lt;T&gt;</li><li>Ex 6: five review bullets for your team</li></ul><p class="muted">CHEATSHEET.md · run-labs.sh expected output</p>`, "Offer office hours.");

    slide(`<h2>Resources</h2><table><tr><td>Slides</td><td>presentation/index.html</td></tr><tr><td>Script</td><td>FACILITATOR_GUIDE.md</td></tr><tr><td>Exercises</td><td>PARTICIPANT_WORKBOOK.md</td></tr><tr><td>Code</td><td>labs/ + run-labs.sh</td></tr></table>`, "Close cleanly.");

    slide(`<div class="kicker">End</div><h1>Questions</h1><p class="big">What would break if we stored balances as <code>double</code>?</p>`, "Listen more than talk.");

    const deck = document.getElementById("deck");
    const notesEl = document.getElementById("notes");
    const pos = document.getElementById("pos");
    const bar = document.getElementById("progress");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    let i = 0;
    function show(n) {
      i = Math.max(0, Math.min(S.length - 1, n));
      deck.innerHTML = '<section class="slide on' + (i === 0 ? ' title-slide' : '') + '">' + S[i].html + "</section>";
      notesEl.innerHTML = "<strong>Notes</strong><br>" + S[i].notes;
      pos.textContent = (i + 1) + " / " + S.length;
      bar.style.width = ((i) / (S.length - 1) * 100) + "%";
      btnPrev.disabled = i === 0;
      btnNext.disabled = i === S.length - 1;
      location.hash = String(i + 1);
    }
    btnPrev.addEventListener("click", () => show(i - 1));
    btnNext.addEventListener("click", () => show(i + 1));
    document.addEventListener("keydown", (e) => {
      if (["ArrowRight","PageDown"," ","Enter"].includes(e.key)) { e.preventDefault(); show(i + 1); }
      if (["ArrowLeft","PageUp","Backspace"].includes(e.key)) { e.preventDefault(); show(i - 1); }
      if (e.key === "Home") show(0);
      if (e.key === "End") show(S.length - 1);
      if (e.key === "n" || e.key === "N") notesEl.classList.toggle("on");
      if (e.key === "p" || e.key === "P") window.print();
    });
    const start = parseInt(location.hash.replace("#", ""), 10);
    show(Number.isFinite(start) && start > 0 ? start - 1 : 0);
  </script>
</body>
</html>
